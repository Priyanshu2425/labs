name = "buildspace-labs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Response cache for /api/offer (skips repeat LLM calls on identical inputs).
# Namespace created via `wrangler kv namespace create OFFER_CACHE`.
# NOTE: for the deployed Pages project you must ALSO add this binding in the
# dashboard → Settings → Functions → KV namespace bindings (same name + id).
[[kv_namespaces]]
binding = "OFFER_CACHE"
id = "932670805ea540219bc05c2986197716"
